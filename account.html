<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>J2050 Team Management – Account</title>
  <script>
    // Apply the saved theme before the first paint (keys documented in js/theme.js).
    // The cookie is read first (it is shared across ports); localStorage covers a
    // cleared cookie jar.
    const themeCookie = document.cookie.match(/(?:^|;\s*)j2050-theme=(light|dark)(?:;|$)/);
    let saved = themeCookie ? themeCookie[1] : null;
    try {
      saved = saved || localStorage.getItem('j2050-theme');
    } catch {
      // Storage unavailable: the cookie still decides.
    }
    document.documentElement.dataset.theme =
      saved === 'dark' || saved === 'light' ? saved
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="css/style.css"></head>
<body>
  <header id="app-header"></header>
  <main id="app-main" class="narrow">
    <h1>Account</h1>

    <section class="card">
      <h2>Profile</h2>
      <p class="hint" id="account-email"></p>
      <form id="name-form" class="stack" novalidate>
        <label for="first-name">First name</label>
        <input id="first-name" type="text" maxlength="60" autocomplete="given-name" required>
        <label for="last-name">Last name</label>
        <input id="last-name" type="text" maxlength="60" autocomplete="family-name" required>
        <button id="name-btn" type="submit">Save name</button>
        <p id="name-msg" class="message" role="alert" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Change password</h2>
      <form id="password-form" class="stack" novalidate>
        <label for="password">New password (at least 12 characters)</label>
        <input id="password" type="password" autocomplete="new-password" required>
        <label for="password2">Repeat new password</label>
        <input id="password2" type="password" autocomplete="new-password" required>
        <button id="password-btn" type="submit">Change password</button>
        <p id="password-msg" class="message" role="alert" hidden></p>
      </form>
    </section>

    <section class="card" id="notices-card" hidden>
      <h2>E-mails for admins</h2>
      <p class="hint">Choose the notices for admins you receive. E-mails about yourself (your lab hours, your tasks,
        your documents) always arrive. A notice that no admin receives is sent to all the admins.</p>
      <form id="notices-form" class="stack" novalidate>
        <div class="prefs" id="notices-list"></div>
        <button id="notices-btn" type="submit">Save e-mail choices</button>
        <p id="notices-msg" class="message" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';
    import { initProtectedPage, checkPassword, friendlyError, showMessage } from './js/auth.js';

    const profile = await initProtectedPage('account');
    if (profile) {
      document.getElementById('account-email').textContent = profile.email ?? '';
      document.getElementById('first-name').value = profile.first_name ?? '';
      document.getElementById('last-name').value = profile.last_name ?? '';

      // Name
      const nameMsg = document.getElementById('name-msg');
      document.getElementById('name-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const firstName = document.getElementById('first-name').value.trim();
        const lastName = document.getElementById('last-name').value.trim();
        if (!firstName || !lastName) {
          showMessage(nameMsg, 'First name and last name are both required.');
          return;
        }
        const { error } = await supabase
          .from('profiles')
          .update({ first_name: firstName, last_name: lastName })
          .eq('id', profile.id);
        if (error) { showMessage(nameMsg, friendlyError(error)); return; }
        document.getElementById('user-name').textContent = `${firstName} ${lastName}`;
        showMessage(nameMsg, 'Name saved.', 'success');
      });

      // Password
      const pwMsg = document.getElementById('password-msg');
      document.getElementById('password-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const check = checkPassword(password, password2);
        if (check) { showMessage(pwMsg, check); return; }

        const button = document.getElementById('password-btn');
        button.disabled = true;
        const { error } = await supabase.auth.updateUser({ password });
        button.disabled = false;
        if (error) { showMessage(pwMsg, friendlyError(error)); return; }
        event.target.reset();
        showMessage(pwMsg, 'Password changed.', 'success');
      });

      // E-mails for admins (migration 013): notices each admin chooses to receive
      if (profile.role === 'admin') await initNotices();
    }

    async function initNotices() {
      const NOTICES = [
        ['registrations', 'New registrations', 'Accounts awaiting approval in Members.'],
        ['shift_requests', 'Shift requests', 'New requests of lab shifts, to approve or reject.'],
        ['tasks_overdue', 'Overdue tasks', 'Summary of the tasks whose due date has passed without completion.'],
        ['doc_review', 'Versions for review', 'Document versions sent for review, to approve or return.'],
        ['doc_due', 'Documents due', 'Summary 14, 7 and 1 days before the data package of a milestone. The SYS leader always receives it.'],
      ];
      const msg = document.getElementById('notices-msg');
      const list = document.getElementById('notices-list');
      let admins = [];
      let prefs = new Map();

      async function load() {
        const [a, p] = await Promise.all([
          supabase.from('profiles').select('id, full_name, email').eq('role', 'admin').eq('status', 'active'),
          supabase.from('notification_prefs').select('user_id, muted'),
        ]);
        if (a.error || p.error) { showMessage(msg, friendlyError(a.error || p.error)); return false; }
        admins = a.data;
        prefs = new Map(p.data.map((x) => [x.user_id, x.muted ?? []]));
        return true;
      }

      // Who receives each notice now (all the admins when nobody wants it)
      function receivers(key) {
        const yes = admins.filter((x) => !(prefs.get(x.id) ?? []).includes(key));
        const names = (yes.length ? yes : admins).map((x) => x.full_name ?? x.email).sort();
        return `${yes.length ? 'Received by' : 'Nobody chose it, sent to all'}: ${names.join(', ') || 'none'}`;
      }

      function render() {
        const mine = prefs.get(profile.id) ?? [];
        list.replaceChildren(...NOTICES.map(([key, title, text]) => {
          const label = document.createElement('label');
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.id = `notice-${key}`;
          box.value = key;
          box.checked = !mine.includes(key);
          const name = document.createElement('span');
          name.textContent = title;
          const sub = document.createElement('span');
          sub.className = 'sub';
          sub.textContent = `${text} ${receivers(key)}.`;
          label.append(box, name, sub);
          return label;
        }));
      }

      if (!(await load())) return;
      render();
      document.getElementById('notices-card').hidden = false;

      document.getElementById('notices-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const muted = [...list.querySelectorAll('input[type="checkbox"]')].filter((b) => !b.checked).map((b) => b.value);
        const button = document.getElementById('notices-btn');
        button.disabled = true;
        const { error } = await supabase.rpc('set_notification_prefs', { p_muted: muted });
        button.disabled = false;
        if (error) { showMessage(msg, friendlyError(error)); return; }
        if (await load()) render();
        showMessage(msg, 'E-mail choices saved.', 'success');
      });
    }
  </script>
</body>
</html>
