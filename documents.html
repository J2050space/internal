<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J2050 Team Management – Documents</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gantt.css">
  <link rel="stylesheet" href="css/documents.css">
</head>
<body>
  <header id="app-header"></header>
  <main id="app-main" style="max-width:none">
    <div class="g-top">
      <div>
        <h1>Documents</h1>
        <p class="g-sub">RedPill (J2050) – file names: [SUBTEAM]_[TYPE]_[Title]_VXX</p>
      </div>
      <ul class="stats" id="stats"></ul>
    </div>
    <nav class="g-nav" id="d-nav" aria-label="Views"></nav>
    <div id="view"><p class="hint">Loading…</p></div>
  </main>
  <div id="d-modal" class="modal" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="js/documents.js"></script>
</body>
</html>
