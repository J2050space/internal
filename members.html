<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J2050 Team Management – Members</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>
  <main id="app-main">
    <h1>Members</h1>
    <p id="members-msg" class="message" role="alert" hidden></p>
    <div id="members-sections"></div>
  </main>

  <script type="module">
    import { supabase } from './js/config.js';
    import { initProtectedPage, friendlyError, showMessage } from './js/auth.js';
    import { formatDate, formatDateTime } from './js/format.js';

    const me = await initProtectedPage('members', { adminOnly: true });
    const msg = document.getElementById('members-msg');
    const container = document.getElementById('members-sections');

    const SECTIONS = [
      { key: 'pending',     title: 'Awaiting approval',
        filter: (m) => m.status === 'pending' && m.email_confirmed },
      { key: 'active',      title: 'Active members',
        filter: (m) => m.status === 'active' },
      { key: 'disabled',    title: 'Disabled',
        filter: (m) => m.status === 'disabled' },
      { key: 'unconfirmed', title: 'Email not confirmed yet',
        filter: (m) => m.status === 'pending' && !m.email_confirmed,
        note: 'These users have not opened the confirmation link. ' +
              'Accounts created by mistake can be deleted from Supabase > Authentication > Users.' },
    ];

    function cell(row, text) {
      const td = document.createElement('td');
      td.textContent = text ?? '';
      row.appendChild(td);
      return td;
    }

    function actionButton(td, label, kind, onClick) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.className = kind;
      b.addEventListener('click', onClick);
      td.appendChild(b);
    }

    async function setMember(member, changes, question) {
      const name = member.first_name ? `${member.first_name} ${member.last_name}` : member.email;
      if (!window.confirm(`${question}\n\n${name}`)) return;
      const { error } = await supabase.rpc('admin_set_member', {
        p_user_id: member.id,
        p_role: changes.role ?? null,
        p_status: changes.status ?? null,
      });
      if (error) { showMessage(msg, friendlyError(error)); return; }
      showMessage(msg, 'Member updated.', 'success');
      await load();
    }

    function actions(td, m) {
      if (m.id === me.id) {           // own account: no actions, prevents lock-out
        td.textContent = '(you)';
        return;
      }
      if (m.status === 'pending' && m.email_confirmed) {
        actionButton(td, 'Approve', 'primary', () =>
          setMember(m, { status: 'active' }, 'Approve this account?'));
        actionButton(td, 'Reject', 'danger', () =>
          setMember(m, { status: 'disabled' }, 'Reject (disable) this account?'));
      } else if (m.status === 'active') {
        if (m.role === 'admin') {
          actionButton(td, 'Make user', 'secondary', () =>
            setMember(m, { role: 'user' }, 'Remove administrator rights?'));
        } else {
          actionButton(td, 'Make admin', 'secondary', () =>
            setMember(m, { role: 'admin' }, 'Grant administrator rights?'));
        }
        actionButton(td, 'Disable', 'danger', () =>
          setMember(m, { status: 'disabled' }, 'Disable this account?'));
      } else if (m.status === 'disabled') {
        actionButton(td, 'Re-enable', 'secondary', () =>
          setMember(m, { status: 'active' }, 'Re-enable this account?'));
      }
    }

    function renderSection(section, members) {
      const wrap = document.createElement('section');
      wrap.className = 'card';
      const h2 = document.createElement('h2');
      h2.textContent = `${section.title} (${members.length})`;
      wrap.appendChild(h2);

      if (section.note) {
        const p = document.createElement('p');
        p.className = 'hint';
        p.textContent = section.note;
        wrap.appendChild(p);
      }
      if (members.length === 0) {
        const p = document.createElement('p');
        p.className = 'hint';
        p.textContent = 'None.';
        wrap.appendChild(p);
        return wrap;
      }

      const scroller = document.createElement('div');
      scroller.className = 'table-scroll';
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr>
        <th>Name</th><th>Email</th><th>Role</th><th>Registered</th><th>Last login</th><th>Actions</th>
      </tr></thead>`;
      const tbody = document.createElement('tbody');
      members.forEach((m) => {
        const tr = document.createElement('tr');
        cell(tr, m.first_name ? `${m.first_name} ${m.last_name ?? ''}` : '—');
        cell(tr, m.email);
        cell(tr, m.role);
        cell(tr, formatDate(m.created_at));
        cell(tr, m.last_sign_in_at ? formatDateTime(m.last_sign_in_at) : '—');
        const td = cell(tr, '');
        td.className = 'actions';
        actions(td, m);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroller.appendChild(table);
      wrap.appendChild(scroller);
      return wrap;
    }

    async function load() {
      const { data, error } = await supabase.rpc('admin_list_members');
      if (error) { showMessage(msg, friendlyError(error)); return; }
      container.replaceChildren(
        ...SECTIONS.map((s) => renderSection(s, data.filter(s.filter)))
      );
    }

    if (me) await load();
  </script>
</body>
</html>
